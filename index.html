<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eibner Ecology</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#f4f4f4;
  color:#333;
}

/* HEADER */
.header{
  background:#f6f1e7;
  text-align:center;
  padding:25px 20px 10px 20px;
}

.header-inner{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
}

.logo{ height:70px; }

.header h1{
  font-family:'Orbitron',sans-serif;
  font-size:56px;
  margin:0;
  color:#4e6b57;
}

/* NAV */
.nav{ margin-top:15px; }
.nav a{
  margin:0 18px;
  text-decoration:none;
  font-weight:600;
  color:#4e6b57;
  font-size:18px;
}
.nav a:hover{ color:#7c9a87; }

/* HERO */
.hero{
  height:420px;
  background:url("Hero1.jpg") center 20% / cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:34px;
  font-weight:600;
}

/* SECTIONS */
.section{
  padding:80px 20px;
  max-width:1100px;
  margin:auto;
}

.two-col{
  display:flex;
  gap:40px;
  align-items:center;
}

.profile-pic{
  width:220px;
  height:220px;
  border-radius:50%;
  object-fit:cover;
  object-position:center top;
}

/* CONTACT FORM */
.contact-form{
  max-width:500px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:15px;
}
input, textarea{
  padding:12px;
  border:1px solid #ccc;
  border-radius:6px;
}
button{
  background:#6E7F61;
  color:white;
  border:none;
  padding:14px;
  font-size:16px;
  border-radius:6px;
  cursor:pointer;
}
button:hover{ background:#5c6b52; }

/* FOOTER */
footer{
  margin-top:80px;
  padding:40px 20px;
  background:#f6f1e7;
  text-align:center;
}

.footer-btn{
  display:inline-block;
  margin:10px;
  padding:10px 18px;
  background:#6E7F61;
  color:white;
  text-decoration:none;
  border-radius:6px;
}

.footer-contact{ margin-bottom:15px; }

</style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <img src="logo.png" class="logo">
    <h1>Eibner Ecology</h1>
  </div>

  <nav class="nav">
    <a href="#profil">Profil</a>
    <a href="#leistungen">Leistungen</a>
    <a href="#kontakt">Kontakt</a>
  </nav>
</header>

<section class="hero">
  Nachhaltige ökologische Dienstleistungen
</section>

<section id="profil" class="section">
  <div class="two-col">
    <div>
      <h2>Profil</h2>
      <p>Ökologische Fachberatung und Umweltplanung.</p>
    </div>
    <img src="Georg Website Profile Pic.jpg" class="profile-pic">
  </div>
</section>

<section id="leistungen" class="section">
  <h2>Leistungen</h2>
  <p>Artenschutz • Umweltplanung • Gutachten • Beratung</p>
</section>

<section id="kontakt" class="section">
  <h2>Kontakt</h2>

  <form class="contact-form" action="https://formspree.io/f/mdawvvoo" method="POST">
    <input type="text" name="name" placeholder="Ihr Name" required>
    <input type="email" name="email" placeholder="Ihre E-Mail" required>
    <textarea name="message" rows="5" placeholder="Ihre Nachricht" required></textarea>
    <button type="submit">Senden</button>
  </form>
</section>

<footer>
  <div class="footer-contact">
    <strong>Kontakt</strong><br>
    Georg Eibner<br>
    ☎ 06221 1234567<br>
    ✉ info@eibner-ecology.de
  </div>

  <a href="impressum.html" class="footer-btn">Impressum</a>
  <a href="datenschutz.html" class="footer-btn">Datenschutz</a>
</footer>

</body>
</html>
